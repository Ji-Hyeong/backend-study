spring:
  datasource:
    # JDBC Testcontainers starts an isolated PostgreSQL instance for the test JVM.
    # This keeps transaction and locking semantics aligned with the documented database.
    url: jdbc:tc:postgresql:16-alpine:///transaction_study
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    username: study
    password: study
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

logging:
  level:
    root: warn
    transaction-study: info
    com.jihyeong.study.transaction: info
    org.springframework.test.context: warn
    org.springframework.boot.test.context: warn
    org.hibernate: warn
