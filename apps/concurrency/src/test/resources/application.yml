spring:
  datasource:
    # Lost-update and row-lock tests must use the same database semantics as production-like runs.
    url: jdbc:tc:postgresql:16-alpine:///concurrency_study
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    username: study
    password: study
    hikari:
      maximum-pool-size: 25
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

logging:
  level:
    concurrency-study: INFO
    com.jihyeong.study.concurrency: INFO
